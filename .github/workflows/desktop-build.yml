name: Build Desktop App (Unsigned)

# Produces unsigned, installable desktop builds for manual testing — no code
# signing / notarization secrets required, since this fork ships no update
# server or paid distribution channel. Trigger manually from the Actions tab
# ("Run workflow") for a one-click build, or it runs automatically on every
# push to main so main always has a fresh, downloadable build.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/readest-app/**'
      - 'packages/**'
      - '.github/workflows/desktop-build.yml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: ubuntu-22.04
            name: linux
            args: '--bundles deb,appimage'
            rust_target: ''
          - os: windows-latest
            name: windows
            args: '--bundles nsis'
            rust_target: ''
          - os: macos-latest
            name: macos
            args: '--target universal-apple-darwin'
            rust_target: 'x86_64-apple-darwin,aarch64-apple-darwin'

    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: initialize git submodules
        run: git submodule update --init --recursive

      - name: setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: copy pdfjs-dist and simplecc-dist to public directory
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.config.rust_target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.config.os }}-${{ matrix.config.name }}-desktop-build

      - name: install Linux build dependencies
        if: matrix.config.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: build
        working-directory: apps/readest-app
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: pnpm tauri build ${{ matrix.config.args }}

      - name: upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readest-${{ matrix.config.name }}
          path: |
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/appimage/*.AppImage
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
